name: Test Telegram Notification

on:
  workflow_dispatch:
    inputs:
      event_url:
        description: Fake event URL shown in the Telegram test card
        required: true
        default: https://example.invalid/hoyo-event-notification-test
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TG_CHANNEL_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_CHAT_ID }}
      TG_NOTIFICATION_TEST: '1'
      TG_TRANSIENT_DELETE_AFTER_SECONDS: '120'
      TEST_EVENT_URL: ${{ inputs.event_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Send Synthetic Event Notification
        run: |
          EVENT_UPDATE_JSON_B64=$(node --input-type=module -e '
            const event = {
              id: "tg-notification-test",
              game: "通知测试",
              gameKey: "test",
              version: "通用",
              title: "[通知测试] 虚拟活动（2 分钟后自动删除）",
              url: process.env.TEST_EVENT_URL,
              date: "2026.07.17",
              startDate: "2026.07.17",
              endDate: "2026.07.18",
              status: "测试",
              reward: "无（仅验证 Telegram 通知链路）",
              tags: ["通知测试"]
            };
            process.stdout.write(Buffer.from(JSON.stringify([event])).toString("base64"));
          ')
          export EVENT_UPDATE_JSON_B64
          node scripts/tg-notify.js finished success true workflow_dispatch 0
