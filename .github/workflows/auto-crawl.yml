name: Auto Crawl Miyoushe Events

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TG_CHANNEL_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_CHAT_ID }}
      TG_TRANSIENT_DELETE_AFTER_SECONDS: ${{ vars.TELEGRAM_TRANSIENT_DELETE_AFTER_SECONDS }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Test Crawler Rules
        run: npm run test:crawler

      - name: Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Record Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Send Sync Started Notification
        run: node scripts/tg-notify.js started ${{ github.event_name }}

      - name: Run Miyoushe Crawler
        run: node scripts/miyoushe-crawler.js

      - name: Update Event Statuses
        run: node scripts/update-statuses.js

      - name: Capture Missing Event Screenshots
        run: npm run screenshots

      - name: Summarize Event Updates
        run: |
          summary_file="${RUNNER_TEMP}/hoyo-event-updates.txt"
          summary_json_file="${RUNNER_TEMP}/hoyo-event-updates.json"
          node scripts/summarize-event-updates.js > "$summary_file"
          node scripts/summarize-event-updates.js --json > "$summary_json_file"
          {
            echo "EVENT_UPDATE_SUMMARY<<__HOYO_EVENT_UPDATES__"
            if [ -s "$summary_file" ]; then
              cat "$summary_file"
              echo
            fi
            echo "__HOYO_EVENT_UPDATES__"
          } >> "$GITHUB_ENV"
          echo "EVENT_UPDATE_JSON_B64=$(base64 -w 0 "$summary_json_file")" >> "$GITHUB_ENV"

      - name: Check for Changes & Commit
        id: commit_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/events.json public/images/screenshots

          if git diff --cached --quiet; then
            echo "No new events or updates found. Skipping commit."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): update events and screenshots from miyoushe"
            for attempt in 1 2 3; do
              if git push origin main; then
                echo "changed=true" >> $GITHUB_OUTPUT
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                break
              fi
              echo "::warning::Push failed on attempt ${attempt}/3; rebasing on latest origin/main before retry."
              git fetch origin main
              git rebase origin/main
            done
            git push origin main
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build Site
        if: steps.commit_step.outputs.changed == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.commit_step.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hoyo-event-archive --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Sync Finished Notification
        if: always()
        run: |
          START=${START_TIME:-$(date +%s)}
          DURATION=$(( $(date +%s) - START ))
          node scripts/tg-notify.js finished ${{ job.status }} ${{ steps.commit_step.outputs.changed || 'false' }} ${{ github.event_name }} $DURATION
