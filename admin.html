<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台管理 | 米游活动档案馆</title>
    <!-- FontAwesome Free Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="admin-app" style="min-height: 100vh; display: flex; flex-direction: column; background: #060713;">
      <!-- Header Section -->
      <header class="header-bar" style="position: static; height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; background: rgba(9, 11, 28, 0.8); border-bottom: 1px solid var(--border-color); backdrop-filter: blur(10px); flex-shrink: 0;">
        <div class="logo-section">
          <div class="logo-icon" style="background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white; box-shadow: 0 0 15px var(--primary-glow);">
            <i class="fa-solid fa-screwdriver-wrench"></i>
          </div>
          <div class="logo-text">
            <h1>档案馆管理后台</h1>
            <p>Admin Dashboard</p>
          </div>
        </div>
        
        <div class="header-right">
          <a href="/index.html" class="nav-item active" style="text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 8px 16px; border-radius: 20px;">
            <i class="fa-solid fa-arrow-left"></i>
            <span>返回主站</span>
          </a>
        </div>
      </header>

      <!-- Main Layout -->
      <div style="flex: 1; display: grid; grid-template-columns: 280px 1fr; overflow: hidden; height: calc(100vh - 70px);">
        <!-- Sidebar controls -->
        <aside style="background: rgba(9, 11, 28, 0.6); border-right: 1px solid var(--border-color); padding: 24px; display: flex; flex-direction: column; gap: 24px; overflow-y: auto; backdrop-filter: blur(10px);">
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <span style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px;">数据动作</span>
            <button class="modal-primary-btn" id="adminAddBtn" style="padding: 12px; border-radius: 10px; font-size: 13.5px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
              <i class="fa-solid fa-plus"></i> 新增活动档案
            </button>
            <button class="modal-secondary-btn" id="adminExportBtn" style="padding: 12px; border-radius: 10px; font-size: 13.5px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px;">
              <i class="fa-solid fa-file-export"></i> 导出数据库 (JSON)
            </button>
          </div>

          <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto;">
            <span style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px;">重置与恢复</span>
            <button class="modal-secondary-btn" id="adminResetBtn" style="padding: 12px; border-radius: 10px; font-size: 13.5px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--status-expired); border-color: rgba(248,113,113,0.2); background: rgba(127,29,29,0.1);">
              <i class="fa-solid fa-trash-can"></i> 重置默认数据
            </button>
          </div>
        </aside>

        <!-- Main Content Area -->
        <main style="padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; background: #060713;">
          <!-- Add/Edit Form (hidden by default) -->
          <div id="adminFormContainer" class="hidden" style="background: rgba(16, 19, 44, 0.85); border: 1.5px solid var(--primary); padding: 24px; border-radius: 16px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 0 30px var(--primary-glow); backdrop-filter: blur(10px);">
            <h3 id="formTitle" style="font-size: 16px; font-weight: 700; color: var(--text-accent); border-left: 3px solid var(--primary); padding-left: 10px;">新增活动档案</h3>
            <input type="hidden" id="formEventId" />
            
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;">
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">活动标题 *</label>
                <input type="text" id="formEventTitle" placeholder="如: 织锦与织意" style="background: rgba(6,7,19,0.8); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; color: white; outline: none; font-size: 13.5px;" />
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">网页链接 (URL) *</label>
                <input type="url" inputmode="url" id="formEventUrl" placeholder="https://..." style="background: rgba(6,7,19,0.8); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; color: white; outline: none; font-size: 13.5px;" />
              </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">所属游戏 *</label>
                <select id="formEventGame" style="background: rgba(6,7,19,0.8); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; color: white; outline: none; font-size: 13.5px;">
                  <option value="原神">原神</option>
                  <option value="星穹铁道">星穹铁道</option>
                  <option value="绝区零">绝区零</option>
                  <option value="崩坏3">崩坏3</option>
                  <option value="全部游戏">其他/通用</option>
                </select>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">活动类型 *</label>
                <select id="formEventType" style="background: rgba(6,7,19,0.8); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; color: white; outline: none; font-size: 13.5px;">
                  <option value="年度报告">年度报告</option>
                  <option value="回归活动">回归活动</option>
                  <option value="版本前瞻">版本前瞻</option>
                  <option value="小游戏">小游戏</option>
                  <option value="资料站">资料站</option>
                  <option value="预约/预抽卡">预约/预抽卡</option>
                  <option value="联动活动">联动活动</option>
                  <option value="其他活动">其他活动</option>
                </select>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">当前状态 *</label>
                <select id="formEventStatus" style="background: rgba(6,7,19,0.8); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; color: white; outline: none; font-size: 13.5px;">
                  <option value="可访问">可访问</option>
                  <option value="已结束">已结束</option>
                  <option value="需登录">需登录</option>
                  <option value="已失效">已失效 (404)</option>
                </select>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">发布日期 *</label>
                <input type="text" id="formEventDate" placeholder="如: 2026.06.07" style="background: rgba(6,7,19,0.8); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; color: white; outline: none; font-size: 13.5px;" />
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px;">
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">标签列表 (半角逗号分隔)</label>
                <input type="text" id="formEventTags" placeholder="如: 版本预热,回归活动,原石奖励" style="background: rgba(6,7,19,0.8); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; color: white; outline: none; font-size: 13.5px;" />
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">关联版本</label>
                <input type="text" id="formEventVersion" placeholder="如: v1.3" style="background: rgba(6,7,19,0.8); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; color: white; outline: none; font-size: 13.5px;" />
              </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">活动简介</label>
              <textarea id="formEventDesc" placeholder="简要描述活动的主要玩法 and 包含的奖励..." rows="3" style="background: rgba(6,7,19,0.8); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; color: white; outline: none; font-size: 13.5px; font-family: var(--font-sans); resize: none;"></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 16px; margin-top: 4px;">
              <button class="modal-secondary-btn" id="formCancelBtn" style="width: auto; height: auto; padding: 10px 20px; border-radius: 8px; font-size: 13px;">取消</button>
              <button class="modal-primary-btn" id="formSaveBtn" style="padding: 10px 20px; border-radius: 8px; font-size: 13px;">保存更改</button>
            </div>
          </div>

          <!-- Search filter -->
          <div style="display: flex; gap: 12px; align-items: center; background: rgba(9, 11, 28, 0.4); border: 1px solid var(--border-color); padding: 12px 18px; border-radius: 12px; flex-shrink: 0;">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted); font-size: 15px;"></i>
            <input type="text" id="adminSearchInput" placeholder="在后台检索活动标题、链接、标签或版本号..." style="flex:1; background: transparent; border: none; padding: 4px; color: white; outline: none; font-size: 14px; font-family: var(--font-sans);" />
          </div>

          <!-- Table Container -->
          <div style="flex: 1; border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; background: rgba(9, 11, 28, 0.35); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px);">
            <div style="height: 100%; overflow-y: auto;">
              <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 13.5px; color: white;">
                <thead>
                  <tr style="background: rgba(9, 11, 28, 0.85); border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-weight: 600; position: sticky; top: 0; z-index: 10;">
                    <th style="padding: 14px 20px; width: 90px;">ID</th>
                    <th style="padding: 14px 20px;">活动名称</th>
                    <th style="padding: 14px 20px; width: 100px;">所属游戏</th>
                    <th style="padding: 14px 20px; width: 110px;">版本</th>
                    <th style="padding: 14px 20px; width: 120px;">类型</th>
                    <th style="padding: 14px 20px; width: 100px;">状态</th>
                    <th style="padding: 14px 20px; width: 140px; text-align: center;">操作</th>
                  </tr>
                </thead>
                <tbody id="adminEventsList">
                  <!-- Rendered Dynamically -->
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/admin.js"></script>
  </body>
</html>
